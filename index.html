<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio Saya</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        dark: '#0f172a',
                        card: '#1e293b',
                        accent: '#38bdf8'
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar agar lebih rapi */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-dark text-slate-300 font-sans antialiased selection:bg-accent selection:text-white">

    <div class="max-w-3xl mx-auto px-6 py-12 md:py-20">
        
        <header id="profile-section" class="flex flex-col md:flex-row items-center md:items-start gap-8 mb-20 animate-fade-in">
            </header>

        <div id="socials-container" class="flex justify-center md:justify-start gap-6 mb-20">
            </div>

        <hr class="border-slate-800 mb-16">

        <section class="mb-20">
            <h2 class="text-2xl font-bold text-white mb-8 flex items-center">
                <span class="text-accent mr-2">#</span> Pengalaman
            </h2>
            <div id="experience-list" class="space-y-8 border-l-2 border-slate-800 ml-3 pl-8 relative">
                </div>
        </section>

        <section class="mb-20">
            <h2 class="text-2xl font-bold text-white mb-8 flex items-center">
                <span class="text-accent mr-2">#</span> Projek Pilihan
            </h2>
            <div id="project-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                </div>
        </section>

        <section class="mb-20">
            <h2 class="text-2xl font-bold text-white mb-8 flex items-center">
                <span class="text-accent mr-2">#</span> Pendidikan
            </h2>
            <div id="education-list" class="space-y-6">
                </div>
        </section>
        <div id="cv-container"></div>
        <footer class="text-center text-sm text-slate-600 pt-10 border-t border-slate-800">
            <p>&copy; <span id="year"></span> Alif Jamaludin.</p>
        </footer>

        
    </div><script src="script.js"></script>
</body>
</html>
