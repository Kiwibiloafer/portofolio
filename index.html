<!DOCTYPE html>
<html lang="id" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio Saya</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        dark: '#0f172a',
                        card: '#1e293b',
                        accent: '#38bdf8'
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar agar lebih rapi */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0f172a;
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        /* Popup styles */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .popup-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .popup-content {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .popup-overlay.active .popup-content {
            transform: scale(1);
        }

        .tech-logo {
            width: 32px;
            height: 32px;
            object-fit: contain;
            filter: brightness(0) invert(1);
            opacity: 0.8;
            transition: all 0.3s ease;
        }

        .tech-logo:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        .tech-stack-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .tech-stack-item:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: rgba(56, 189, 248, 0.4);
            transform: translateY(-2px);
        }
    </style>
</head>

<body class="bg-dark text-slate-300 font-sans antialiased selection:bg-accent selection:text-white">

    <div class="max-w-3xl mx-auto px-6 py-12 md:py-20">

        <header id="profile-section"
            class="flex flex-col md:flex-row items-center md:items-start gap-8 mb-20 animate-fade-in">
        </header>

        <div id="socials-container" class="flex justify-center md:justify-start gap-6 mb-20">
        </div>

        <hr class="border-slate-800 mb-16">

        <section class="mb-20">
            <h2 class="text-2xl font-bold text-white mb-8 flex items-center">
                <span class="text-accent mr-2">#</span> Pendidikan
            </h2>
            <div id="education-list" class="space-y-6">
            </div>
        </section>

        <section class="mb-20">
            <h2 class="text-2xl font-bold text-white mb-8 flex items-center">
                <span class="text-accent mr-2">#</span> Pengalaman
            </h2>
            <div id="experience-list" class="space-y-8 border-l-2 border-slate-800 ml-3 pl-8 relative">
            </div>
        </section>

        <section class="mb-20">
            <h2 class="text-2xl font-bold text-white mb-8 flex items-center">
                <span class="text-accent mr-2">#</span> Sertifikat & Badges
            </h2>
            <div id="certification-list" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            </div>
        </section>

        <section class="mb-20">
            <h2 class="text-2xl font-bold text-white mb-8 flex items-center">
                <span class="text-accent mr-2">#</span> Projek
            </h2>
            <div id="project-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            </div>
        </section>

        <div id="cv-container"></div>

        <!-- Project Detail Popup -->
        <div id="project-popup" class="popup-overlay">
            <div class="popup-content">
                <div class="relative">
                    <button id="close-popup"
                        class="absolute top-4 right-4 text-slate-400 hover:text-white transition-colors z-10">
                        <i class="fas fa-times text-xl"></i>
                    </button>
                    <div class="p-8">
                        <div class="mb-6">
                            <img id="popup-image" src="" alt="" class="w-full h-64 object-cover rounded-lg">
                        </div>
                        <div class="mb-4">
                            <span id="popup-category"
                                class="text-xs text-slate-500 border border-slate-700 px-3 py-1 rounded-full"></span>
                        </div>
                        <h2 id="popup-title" class="text-3xl font-bold text-white mb-4"></h2>
                        <div class="mb-6">
                            <div class="flex items-center gap-2 text-slate-400 mb-4">
                                <i class="fas fa-calendar-alt"></i>
                                <span id="popup-timeline" class="text-sm"></span>
                            </div>
                            <p id="popup-description" class="text-slate-300 leading-relaxed"></p>
                        </div>
                        <div class="mb-6">
                            <h3 class="text-lg font-semibold text-white mb-3">Tech Stack</h3>
                            <div id="popup-tech-stack" class="flex flex-wrap gap-3">
                                <!-- Tech stack items will be inserted here -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Certification Detail Popup -->
        <div id="certification-popup" class="popup-overlay">
            <div class="popup-content">
                <div class="relative">
                    <button id="close-cert-popup"
                        class="absolute top-4 right-4 text-slate-400 hover:text-white transition-colors z-10">
                        <i class="fas fa-times text-xl"></i>
                    </button>
                    <div class="p-8">
                        <div class="flex flex-col md:flex-row gap-6 mb-6">
                            <div class="md:w-1/2">
                                <img id="cert-popup-image" src="" alt=""
                                    class="w-full h-48 object-contain rounded-lg bg-slate-800">
                            </div>
                            <div class="md:w-1/2">
                                <h2 id="cert-popup-title" class="text-2xl font-bold text-white mb-2"></h2>
                                <div class="flex items-center gap-2 text-slate-400 mb-2">
                                    <i class="fas fa-building"></i>
                                    <span id="cert-popup-issuer" class="text-sm"></span>
                                </div>
                                <div class="flex items-center gap-2 text-slate-400 mb-4">
                                    <i class="fas fa-calendar-alt"></i>
                                    <span id="cert-popup-date" class="text-sm"></span>
                                </div>
                                <a id="cert-popup-link" href="#" target="_blank"
                                    class="inline-flex items-center gap-2 bg-accent text-dark font-semibold py-2 px-4 rounded-lg hover:bg-accent/80 transition-colors">
                                    <i class="fas fa-external-link-alt"></i>
                                    <span>Lihat Sertifikat</span>
                                </a>
                            </div>
                        </div>
                        <div class="mb-6">
                            <p id="cert-popup-description" class="text-slate-300 leading-relaxed"></p>
                        </div>
                        <div id="cert-popup-modules-container" class="mb-6">
                            <h3 class="text-lg font-semibold text-white mb-3">Modul</h3>
                            <ul id="cert-popup-modules" class="space-y-2">
                                <!-- Modules will be inserted here -->
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer class="text-center text-sm text-slate-600 pt-10 border-t border-slate-800">
            <p>&copy; <span id="year"></span> Alif Jamaludin.</p>
        </footer>


    </div>
    <script src="script.js"></script>
</body>

</html>
